[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoclock-network"
version = "0.1.0"
description = "Eco'clock — Dona tiempo de cómputo para verificar datos climáticos"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "VeldaniGR", email = "veldanigranroble@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6",
    "PyQt6-Qt6>=6.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[project.scripts]
ecoclock = "client.cli:main"
ecoclock-gui = "client.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*"]

[tool.pytest.ini_options]
testpaths = ["client/tests", "server/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false