<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Eco'clock — Admin</title>
  <style>
    :root {
      --petrol: #0f3a45;
      --petrol-deep: #0a2a33;
      --ocre: #d9a441;
      --ocre-soft: #ecc57a;
      --crema: #f7f0e0;
      --crema-deep: #eadfc6;
      --paper: #fffaf0;
      --ink: #1d2b2e;
      --ink-soft: #5b6a6c;
      --leaf: #3ddc84;
      --leaf-deep: #1f9d57;
      --danger: #b3261e;
      --radius: 18px;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      /* Crepúsculo: del azul petróleo de la noche al ocre del horizonte y la crema del día */
      background:
        linear-gradient(180deg,
          var(--petrol-deep) 0,
          var(--petrol) 150px,
          #6b6a4e 290px,
          var(--ocre) 400px,
          var(--crema) 520px) no-repeat,
        var(--crema);
      overflow-x: hidden;
    }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; position: relative; z-index: 1; }

    /* Cabecera */
    .brand { display: flex; align-items: center; gap: 0.85rem; color: var(--crema); margin-bottom: 2.25rem; }
    .brand svg { width: 46px; height: 46px; flex: none; }
    .brand h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.7rem; letter-spacing: 0.01em; line-height: 1.1; }
    .brand p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--ocre-soft); }

    /* Hoja flotante discreta */
    .leaf {
      position: fixed; right: 6%; top: 90px; width: 34px; height: 34px; z-index: 0;
      opacity: 0.55; pointer-events: none;
      animation: float 9s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(18px) rotate(10deg); }
    }
    @media (prefers-reduced-motion: reduce) { .leaf { animation: none; } }

    /* Paneles */
    .panel {
      background: var(--paper);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(10, 42, 51, 0.18);
      margin-bottom: 1.25rem;
    }

    #loginPanel { max-width: 420px; margin: 1rem auto 0; }
    #loginPanel .lead { margin: 0 0 0.5rem; font-family: var(--serif); font-size: 1.25rem; color: var(--petrol); }
    #loginPanel .hint { margin: 0 0 1rem; font-size: 0.88rem; color: var(--ink-soft); }

    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--petrol); margin-top: 0.85rem; }
    input {
      width: 100%; padding: 0.65rem 0.8rem; margin-top: 0.3rem;
      font: inherit; color: var(--ink);
      background: #fff; border: 1.5px solid var(--crema-deep); border-radius: 12px;
    }
    input:focus-visible { outline: 3px solid rgba(61, 220, 132, 0.45); border-color: var(--leaf-deep); }

    button {
      margin-top: 1.1rem; padding: 0.65rem 1.3rem; cursor: pointer;
      font: inherit; font-weight: 600;
      border-radius: 999px; border: 1.5px solid var(--petrol);
      background: var(--petrol); color: var(--crema);
      transition: background 0.15s, transform 0.15s;
    }
    button:hover { background: var(--petrol-deep); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
    button.secondary { margin-top: 0; background: transparent; color: var(--petrol); }
    button.secondary:hover { background: var(--crema-deep); }

    .err { color: var(--danger); font-size: 0.9rem; min-height: 1.2em; margin: 0.75rem 0 0; }
    .ok { color: var(--leaf-deep); }

    #dashboard { display: none; }

    .session { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 0.9rem 1.25rem; }
    #who { display: flex; align-items: center; gap: 0.6rem; font-size: 0.92rem; color: var(--ink-soft); }
    #who::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      background: var(--leaf); box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.25);
    }

    /* Tarjetas de estadísticas */
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; margin: 1.25rem 0; }
    .card {
      background: var(--paper); border-radius: var(--radius); padding: 1.1rem 1.25rem;
      box-shadow: 0 6px 18px rgba(10, 42, 51, 0.12);
      border-top: 4px solid var(--ocre);
    }
    .card.live { border-top-color: var(--leaf); }
    .card b { display: block; font-family: var(--serif); font-size: 2.1rem; font-weight: 600; color: var(--petrol); line-height: 1.1; }
    .card span { font-size: 0.82rem; color: var(--ink-soft); }

    /* Tabla */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: 0 6px 18px rgba(10, 42, 51, 0.12); background: var(--paper); }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { text-align: left; padding: 0.75rem 0.9rem; font-size: 0.9rem; border-bottom: 1px solid var(--crema-deep); }
    th { background: var(--petrol); color: var(--crema); font-weight: 600; font-size: 0.82rem; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbf3df; }
    td.num { font-variant-numeric: tabular-nums; }

    .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--crema-deep); color: var(--petrol); }
    .badge.super { background: var(--ocre); color: var(--petrol-deep); }
    .muted { color: #9aa5a6; }

    #dashMsg { margin: 0.9rem 0 0; font-size: 0.9rem; }

    [hidden] { display: none !important; }

    /* Pestañas */
    .tabs { display: flex; gap: 0.5rem; margin: 1.25rem 0 0; }
    button.tab { margin-top: 0; background: rgba(255, 250, 240, 0.75); color: var(--petrol); border-color: transparent; }
    button.tab:hover { background: var(--paper); }
    button.tab.active { background: var(--petrol); color: var(--crema); border-color: var(--petrol); }
    .count { display: inline-block; min-width: 1.4em; padding: 0 0.4em; margin-left: 0.35rem; border-radius: 999px; background: var(--leaf); color: var(--petrol-deep); font-size: 0.78rem; text-align: center; }

    /* Buzón de contacto */
    .inbox { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 1rem; margin-top: 1.25rem; align-items: start; }
    .inbox .panel { margin-bottom: 0; }
    .filters { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    button.chip { margin-top: 0; padding: 0.3rem 0.8rem; font-size: 0.82rem; background: transparent; color: var(--petrol); }
    button.chip.active { background: var(--petrol); color: var(--crema); }
    #threadList { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
    button.thread-item {
      margin-top: 0; width: 100%; text-align: left; display: grid; gap: 0.15rem;
      padding: 0.6rem 0.8rem; border-radius: 12px; background: #fff; color: var(--ink);
      border: 1.5px solid var(--crema-deep); font-weight: 400;
    }
    button.thread-item:hover { background: #fbf3df; }
    button.thread-item b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.thread-item span, button.thread-item small { color: var(--ink-soft); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.thread-item.unread { border-left: 5px solid var(--leaf); }
    button.thread-item.unread b { color: var(--petrol); }
    button.thread-item.active { border-color: var(--petrol); background: #fbf3df; }
    .thread-head { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    .thread-head h2 { margin: 0; font-family: var(--serif); font-size: 1.25rem; color: var(--petrol); overflow-wrap: anywhere; }
    .thread-head p { margin: 0.2rem 0 0; font-size: 0.88rem; }
    .msgs { display: grid; gap: 0.75rem; margin: 1rem 0; }
    .msg { border-radius: 14px; padding: 0.7rem 0.9rem; background: #fff; border: 1.5px solid var(--crema-deep); }
    .msg.out { background: #eef8f1; border-color: #bfe6cd; }
    .msg.note { background: #fff6dc; border-style: dashed; }
    .msg-meta { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 0.35rem; flex-wrap: wrap; }
    /* El contenido de los correos es texto no confiable: solo se muestra como texto */
    .msg-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.92rem; }
    textarea {
      width: 100%; padding: 0.65rem 0.8rem; margin-top: 0.3rem; font: inherit; color: var(--ink);
      background: #fff; border: 1.5px solid var(--crema-deep); border-radius: 12px; resize: vertical;
    }
    textarea:focus-visible { outline: 3px solid rgba(61, 220, 132, 0.45); border-color: var(--leaf-deep); }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .actions button { margin-top: 0.75rem; }
    button:disabled { opacity: 0.6; cursor: default; }
    #contactSearch { margin: 0 0 0.75rem; }
    #contactList { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
    .compose-title { margin: 0 0 0.5rem; font-family: var(--serif); font-size: 1.25rem; color: var(--petrol); }
    @media (max-width: 760px) { .inbox { grid-template-columns: 1fr; } }

    @media (max-width: 520px) {
      .brand h1 { font-size: 1.4rem; }
      .leaf { right: 4%; }
    }
  </style>
</head>
<body>
  <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 4C10 4 4 9.5 4 16c0 1.4.3 2.7.8 3.8C6 15 9 11.5 14 9c-3 2.8-5 6-5.9 10.4.6.2 1.3.3 1.9.3 6.5 0 10-6 10-15.7Z" fill="#3ddc84"/>
  </svg>

  <div class="wrap">
    <header class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#ecc57a" stroke-width="2.5"/>
        <path d="M24 9v15l9 6" fill="none" stroke="#f7f0e0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M38 5c-8 0-13 4.4-13 9.6 0 1.1.2 2.100.6 3C26.600 14 29 11.200 33 9.200c-2.400 2.200-4 4.800-4.700 8.300.5.100 1 .2 1.500.2 5.200 0 8.200-4.800 8.200-12.700Z" fill="#3ddc84"/>
      </svg>
      <div>
        <h1>Eco'clock Network</h1>
        <p>Panel de administración</p>
      </div>
    </header>

    <section class="panel" id="loginPanel">
      <p class="lead">Acceso superadmin</p>
      <p class="hint">Solo para el equipo del proyecto.</p>
      <label for="username">Usuario</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div>
        <button id="loginBtn" type="button">Entrar</button>
      </div>
      <p id="loginMsg" class="err" role="alert"></p>
    </section>

    <main id="dashboard">
      <div class="panel session">
        <span id="who"></span>
        <button class="secondary" id="logoutBtn" type="button">Cerrar sesión</button>
      </div>
      <nav class="tabs" aria-label="Secciones">
        <button type="button" class="tab active" data-tab="panel">Panel</button>
        <button type="button" class="tab" data-tab="inbox">Buzón<span id="inboxBadge" class="count" hidden></span></button>
      </nav>

      <section id="tab-panel">
      <div class="row" id="cards"></div>
      <div class="table-wrap">
        <table id="users">
          <thead>
            <tr>
              <th>ID</th><th>Usuario</th><th>Correo</th><th>Superadmin</th><th>Nodo</th>
              <th>Rol</th><th>Créditos</th><th>Alta</th><th>Última act.</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="dashMsg" role="status"></p>
      </section>

      <section id="tab-inbox" hidden>
        <div class="inbox">
          <aside class="panel">
            <div class="filters" id="viewSwitch">
              <button type="button" class="chip active" data-view="threads">Conversaciones</button>
              <button type="button" class="chip" data-view="contacts">Contactos</button>
              <button type="button" class="chip" data-action="compose">+ Nuevo mensaje</button>
            </div>

            <div id="threadsPane">
              <div class="filters" id="filters">
                <button type="button" class="chip active" data-status="open">Abiertos</button>
                <button type="button" class="chip" data-status="closed">Cerrados</button>
                <button type="button" class="chip" data-status="all">Todos</button>
              </div>
              <ul id="threadList"></ul>
              <p id="threadsMsg" class="muted"></p>
            </div>

            <div id="contactsPane" hidden>
              <input id="contactSearch" type="search" maxlength="100" placeholder="Buscar por nombre o correo" aria-label="Buscar contactos" />
              <ul id="contactList"></ul>
              <p id="contactsMsg" class="muted"></p>
            </div>
          </aside>
          <article class="panel" id="threadView">
            <p class="muted">Selecciona una conversación.</p>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API = window.location.origin;
    const KEY = "ecoclock_admin_token";
    const USER_KEY = "ecoclock_admin_user";

    function token() { return sessionStorage.getItem(KEY) || ""; }

    // Escapa texto de la API antes de insertarlo como HTML
    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      if (!username || !password) {
        msg.textContent = "Usuario y contraseña obligatorios";
        return;
      }
      try {
        const res = await fetch(API + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
        if (!data.access_token) throw new Error("Respuesta sin access_token");
        sessionStorage.setItem(KEY, data.access_token);
        sessionStorage.setItem(USER_KEY, username);
        document.getElementById("password").value = "";
        await showDashboard();
      } catch (e) {
        msg.textContent = String(e.message || e);
      }
    }

    function logout() {
      sessionStorage.removeItem(KEY);
      sessionStorage.removeItem(USER_KEY);
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginPanel").style.display = "block";
      document.getElementById("loginMsg").textContent = "";
    }

    async function showDashboard() {
      const t = token();
      if (!t) {
        logout();
        return;
      }
      document.getElementById("loginPanel").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      document.getElementById("who").textContent =
        "Sesión: " + (sessionStorage.getItem(USER_KEY) || "");

      const headers = { Authorization: "Bearer " + t };
      const dashMsg = document.getElementById("dashMsg");
      dashMsg.textContent = "";
      dashMsg.className = "";

      try {
        const [sRes, uRes] = await Promise.all([
          fetch(API + "/admin/summary", { headers }),
          fetch(API + "/admin/users", { headers }),
        ]);
        if (sRes.status === 403 || uRes.status === 403) {
          throw new Error("No eres superadmin (403)");
        }
        if (!sRes.ok) throw new Error("summary " + sRes.status);
        if (!uRes.ok) throw new Error("users " + uRes.status);

        const summary = await sRes.json();
        const users = await uRes.json();

        const items = [
          ["Usuarios", summary.total_users, false],
          ["Nodos", summary.total_nodes, false],
          ["En nodo", summary.users_in_node, false],
          ["Activos 24h", summary.active_users_24h, true],
          ["Tareas 24h", summary.tasks_completed_24h, true],
          ["Auto 24h", summary.auto_results_24h, true],
        ];
        document.getElementById("cards").innerHTML = items.map(([k, v, live]) =>
          `<div class="card${live ? " live" : ""}"><b>${esc(v)}</b><span>${esc(k)}</span></div>`
        ).join("");

        document.querySelector("#users tbody").innerHTML = (users.users || []).map(u =>
          `<tr>
            <td class="num">${esc(u.id)}</td>
            <td>${esc(u.username)}</td>
            <td>${u.email ? esc(u.email) : '<span class="muted">—</span>'}</td>
            <td>${u.is_superadmin ? '<span class="badge super">sí</span>' : ""}</td>
            <td>${u.node_name ? esc(u.node_name) : '<span class="muted">—</span>'}</td>
            <td>${u.node_role ? '<span class="badge">' + esc(u.node_role) + "</span>" : '<span class="muted">—</span>'}</td>
            <td class="num">${esc(u.credits)}</td>
            <td class="num">${esc((u.created_at || "").slice(0, 10))}</td>
            <td class="num">${u.last_active_at ? esc(u.last_active_at.slice(0, 16).replace("T", " ")) : '<span class="muted">—</span>'}</td>
          </tr>`
        ).join("");

        dashMsg.textContent = users.total + " usuarios";
        dashMsg.className = "ok";
        showTab("panel");
        refreshInboxBadge();
      } catch (e) {
        dashMsg.textContent = String(e.message || e);
        dashMsg.className = "err";
        if (String(e.message || e).includes("403")) logout();
      }
    }

    // ---------------------------------------------------------- Buzón
    const $ = (id) => document.getElementById(id);
    let inboxStatus = "open";
    let currentThread = null;
    let currentContact = "";
    let inboxView = "threads";
    let lastContacts = [];
    let contactTimer = null;

    async function api(path, opts = {}) {
      const headers = { Authorization: "Bearer " + token() };
      if (opts.body) headers["Content-Type"] = "application/json";
      const res = await fetch(API + path, { ...opts, headers });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (res.status === 401) { logout(); throw new Error("Sesión caducada"); }
      if (!res.ok) {
        const d = data && data.detail;
        throw new Error(typeof d === "string" ? d : (res.status === 422 ? "Datos no válidos: revisa el correo, el asunto y el texto" : "Error " + res.status));
      }
      return data;
    }

    function fmt(iso) { return iso ? iso.slice(0, 16).replace("T", " ") : ""; }

    function updateBadge(n) {
      const badge = $("inboxBadge");
      badge.textContent = n;
      badge.hidden = !n;
    }

    async function refreshInboxBadge() {
      if (!token()) return;
      try {
        const data = await api("/admin/contact/threads?status=open&limit=1");
        updateBadge(data.unread);
      } catch (_) { /* el panel principal sigue funcionando sin el buzón */ }
    }

    function showTab(name) {
      document.querySelectorAll("button.tab").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === name));
      $("tab-panel").hidden = name !== "panel";
      $("tab-inbox").hidden = name !== "inbox";
      if (name === "inbox") { if (inboxView === "contacts") loadContacts(); else loadThreads(); }
    }

    async function loadThreads() {
      const list = $("threadList");
      const msg = $("threadsMsg");
      msg.textContent = "";
      try {
        const data = await api("/admin/contact/threads?status=" + inboxStatus);
        updateBadge(data.unread);
        list.innerHTML = data.threads.map(t =>
          `<li><button type="button" class="thread-item${t.is_read ? "" : " unread"}${currentThread === t.id ? " active" : ""}" data-id="${esc(t.id)}">
            <b>${esc(t.subject)}</b>
            <span>${esc(t.contact_name || t.contact_email)}</span>
            <small>${esc(fmt(t.last_message_at))} · ${esc(t.message_count)} msg</small>
          </button></li>`
        ).join("");
        if (!data.threads.length) msg.textContent = "No hay conversaciones.";
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    // El contenido de los correos es no confiable: todo pasa por esc()
    function msgHtml(m) {
      const who = m.direction === "in" ? m.from_addr
        : m.direction === "out" ? "Eco'clock"
        : "Nota interna · " + m.from_addr;
      return `<div class="msg ${esc(m.direction)}">
        <div class="msg-meta"><b>${esc(who)}</b><span>${esc(fmt(m.created_at))}</span></div>
        <div class="msg-body">${esc(m.body_text || "")}</div>
        ${m.auth_summary ? `<small class="muted">${esc(m.auth_summary)}</small>` : ""}
      </div>`;
    }

    async function openThread(id) {
      currentThread = id;
      const view = $("threadView");
      try {
        const data = await api("/admin/contact/threads/" + id);
        const t = data.thread;
        currentContact = t.contact_email;
        const closing = t.status === "open";
        view.innerHTML = `
          <div class="thread-head">
            <div>
              <h2>${esc(t.subject)}</h2>
              <p class="muted">${esc(t.contact_name ? t.contact_name + " · " : "")}${esc(t.contact_email)}</p>
            </div>
            <button type="button" class="secondary" data-action="toggle-status" data-status="${closing ? "closed" : "open"}">${closing ? "Cerrar" : "Reabrir"}</button>
          </div>
          <div class="msgs">${data.messages.map(msgHtml).join("")}</div>
          <label for="replyBody">Tu respuesta (se envía desde la dirección de contacto)</label>
          <textarea id="replyBody" rows="5" maxlength="10000"></textarea>
          <div class="actions">
            <button type="button" data-action="send-reply">Enviar respuesta</button>
            <button type="button" class="secondary" data-action="add-note">Guardar como nota interna</button>
          </div>
          <p id="threadMsg" class="err" role="status"></p>`;
        loadThreads();
        refreshInboxBadge();
      } catch (e) {
        view.innerHTML = `<p class="err">${esc(e.message)}</p>`;
      }
    }

    $("threadList").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-id]");
      if (btn) openThread(Number(btn.dataset.id));
    });

    $("filters").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-status]");
      if (!btn) return;
      inboxStatus = btn.dataset.status;
      document.querySelectorAll("#filters .chip").forEach(b =>
        b.classList.toggle("active", b === btn));
      loadThreads();
    });

    $("threadView").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action !== "send-new" && currentThread === null) return;
      const id = currentThread;
      const note = (text, ok) => {
        const el = $("threadMsg");
        if (!el) return;
        el.className = ok ? "ok" : "err";
        el.textContent = text;
      };
      note("", false);

      try {
        if (action === "send-new") {
          const to = ($("composeTo").value || "").trim();
          const subject = ($("composeSubject").value || "").trim();
          const body = ($("composeBody").value || "").trim();
          if (!to || !subject || !body) {
            note("Completa destinatario, asunto y mensaje.", false);
            return;
          }
          if (!confirm("¿Enviar este mensaje a " + to + "?")) return;
          btn.disabled = true;
          const created = await api("/admin/contact/threads/new", {
            method: "POST",
            body: JSON.stringify({ to_email: to, subject, body }),
          });
          setInboxView("threads");
          await openThread(created.thread_id);
          note("Mensaje enviado.", true);
          return;
        }

        if (action === "toggle-status") {
          await api("/admin/contact/threads/" + id, {
            method: "PATCH",
            body: JSON.stringify({ status: btn.dataset.status }),
          });
          await openThread(id);
          return;
        }

        const body = ($("replyBody").value || "").trim();
        if (!body) { note("Escribe un texto antes de continuar.", false); return; }
        const isReply = action === "send-reply";
        if (isReply && !confirm("¿Enviar esta respuesta a " + currentContact + "?")) return;

        btn.disabled = true;
        await api("/admin/contact/threads/" + id + (isReply ? "/reply" : "/note"), {
          method: "POST",
          body: JSON.stringify({ body }),
        });
        await openThread(id);
        note(isReply ? "Respuesta enviada." : "Nota guardada.", true);
      } catch (e) {
        note(e.message, false);
        btn.disabled = false;
      }
    });

    // ------------------------------------------------ Contactos y mensaje nuevo
    function composeHtml(prefill) {
      const p = prefill || {};
      return `
        <h2 class="compose-title">Nuevo mensaje</h2>
        <label for="composeTo">Para</label>
        <input id="composeTo" type="email" maxlength="320" value="${esc(p.email || "")}" placeholder="persona@ejemplo.com" />
        ${p.name ? `<p class="muted">${esc(p.name)}</p>` : ""}
        <label for="composeSubject">Asunto</label>
        <input id="composeSubject" type="text" maxlength="200" />
        <label for="composeBody">Mensaje</label>
        <textarea id="composeBody" rows="8" maxlength="10000"></textarea>
        <div class="actions">
          <button type="button" data-action="send-new">Enviar</button>
        </div>
        <p id="threadMsg" class="err" role="status"></p>`;
    }

    function setInboxView(view) {
      inboxView = view;
      document.querySelectorAll("#viewSwitch .chip[data-view]").forEach(b =>
        b.classList.toggle("active", b.dataset.view === view));
      $("threadsPane").hidden = view !== "threads";
      $("contactsPane").hidden = view !== "contacts";
      if (view === "contacts") loadContacts(); else loadThreads();
    }

    async function loadContacts() {
      const msg = $("contactsMsg");
      msg.textContent = "";
      try {
        const q = $("contactSearch").value.trim();
        const data = await api("/admin/contact/contacts?limit=100&q=" + encodeURIComponent(q));
        lastContacts = data.contacts;
        $("contactList").innerHTML = data.contacts.map((c, i) =>
          `<li><button type="button" class="thread-item" data-i="${i}">
            <b>${esc(c.name || c.email)}</b>
            <span>${esc(c.name ? c.email : "")}</span>
            <small>${c.kind === "user" ? "Usuario" : "Externo"} · ${esc(c.thread_count)} conv.${c.last_message_at ? " · " + esc(fmt(c.last_message_at)) : ""}</small>
          </button></li>`
        ).join("");
        if (!data.contacts.length) msg.textContent = "Sin resultados.";
        else if (data.total > data.contacts.length)
          msg.textContent = "Mostrando " + data.contacts.length + " de " + data.total + ". Afina la búsqueda.";
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    $("viewSwitch").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      if (btn.dataset.view) {
        setInboxView(btn.dataset.view);
      } else if (btn.dataset.action === "compose") {
        currentThread = null;
        $("threadView").innerHTML = composeHtml({});
      }
    });

    $("contactList").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-i]");
      if (!btn) return;
      const c = lastContacts[Number(btn.dataset.i)];
      if (!c) return;
      currentThread = null;
      $("threadView").innerHTML = composeHtml({ email: c.email, name: c.name });
    });

    $("contactSearch").addEventListener("input", () => {
      clearTimeout(contactTimer);
      contactTimer = setTimeout(loadContacts, 300);
    });

    document.querySelector(".tabs").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-tab]");
      if (btn) showTab(btn.dataset.tab);
    });

    setInterval(refreshInboxBadge, 60000);

    document.getElementById("loginBtn").onclick = login;
    document.getElementById("logoutBtn").onclick = logout;
    document.getElementById("password").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") login();
    });

    if (token()) showDashboard();
  </script>
</body>
</html>
