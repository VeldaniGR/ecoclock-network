  services:
    db:
      image: postgres:16-alpine
      container_name: ecoclock-db
      environment:
        POSTGRES_USER: ecoclock
        POSTGRES_PASSWORD: Veldani&Octo555$
        POSTGRES_DB: ecoclock
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ecoclock -d ecoclock"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    redis:
      image: redis:7-alpine
      container_name: ecoclock-redis
     #  ports:
       # - "6379:6379"
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    api:
      build:
        context: ./server
        dockerfile: Dockerfile
      container_name: ecoclock-api
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://ecoclock:Veldani&Octo555$@db:5432/ecoclock
        REDIS_URL: redis://redis:6379/0
        RESEND_API_KEY: ${RESEND_API_KEY}
        RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@ecoclock.org}
        PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
        SECRET_KEY: 330d370a9f63bfd0f8ec4458f576edd9e397f2659a17c7d255914e23b890af07
        ENVIRONMENT: production
      ports:
        - "8000:8000"
      volumes:
        - api-uploads:/app/uploads
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000
      restart: unless-stopped

  volumes:
    postgres-data:
    redis-data:
