  services:
    db:
      image: postgres:16-alpine
      container_name: ecoclock-db
      environment:
        POSTGRES_USER: ecoclock
        POSTGRES_PASSWORD: CHANGE_ME_dev_password
        POSTGRES_DB: ecoclock
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ecoclock -d ecoclock"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    redis:
      image: redis:7-alpine
      container_name: ecoclock-redis
      ports:
        - "6379:6379"
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    api:
      build:
        context: ./server
        dockerfile: Dockerfile
      container_name: ecoclock-api
      environment:
        DATABASE_URL: postgresql://ecoclock:CHANGE_ME_dev_password@db:5432/ecoclock
        REDIS_URL: redis://redis:6379/0
        SECRET_KEY: CHANGE_ME_dev_secret_key
        ENVIRONMENT: development
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000
      restart: unless-stopped

  volumes:
    postgres-data:
    redis-data:
