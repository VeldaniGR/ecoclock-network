name: build-binaries

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject version into cli.py
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path('client/cli.py')
          s = p.read_text()
          tag = '${GITHUB_REF_NAME}'
          s = re.sub(r'__cli_version__ = ".*?"', f'__cli_version__ = "{tag}"', s)
          p.write_text(s)
          PY

      - name: Install client + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller client/cli.spec

      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          version=${GITHUB_REF_NAME#v}
          mv dist/ecoclock-cli "dist/ecoclock-cli-v${version}-linux-x86_64"

      - name: PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pyinstaller client/cli.spec
          mv dist/ecoclock-cli.exe "dist/ecoclock-cli-${GITHUB_REF_NAME}-windows-x86_64.exe"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ecoclock-cli-*
