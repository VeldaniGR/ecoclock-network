name: build-binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject version into cli.py
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('client/cli.py')
          s = p.read_text()
          tag = os.environ['ECOCLOCK_VERSION']
          s = re.sub(r'__cli_version__ = ".*?"', f'__cli_version__ = "{tag}"', s)
          p.write_text(s)
          PY
        env:
          ECOCLOCK_VERSION: ${{ github.ref_name }}

      - name: Install client + PyInstaller + GUI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install "PyQt6>=6.6" "PyQt6-Qt6>=6.6"
          pip install pyinstaller

      # ---------- CLI ----------
      - name: PyInstaller CLI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd client
          pyinstaller cli.spec --noconfirm --clean

      - name: Package CLI Linux (onedir)
        if: matrix.os == 'ubuntu-latest'
        run: |
          version=${GITHUB_REF_NAME#v}
          cd client/dist
          tar -czf "ecoclock-cli-v${version}-linux-x86_64.tar.gz" ecoclock-cli/

      - name: PyInstaller CLI (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client
          pyinstaller cli.spec --noconfirm --clean

      - name: Package CLI Windows (onedir)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client/dist
          7z a "ecoclock-cli-${GITHUB_REF_NAME}-windows-x86_64.zip" ecoclock-cli/

      # ---------- GUI ----------
      - name: PyInstaller GUI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd client
          pyinstaller gui.spec --noconfirm --clean

      - name: Package GUI Linux (onedir)
        if: matrix.os == 'ubuntu-latest'
        run: |
          version=${GITHUB_REF_NAME#v}
          cd client/dist
          tar -czf "ecoclock-gui-v${version}-linux-x86_64.tar.gz" ecoclock-gui/

      - name: PyInstaller GUI (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client
          pyinstaller gui.spec --noconfirm --clean

      - name: Package GUI Windows (onedir)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client/dist
          7z a "ecoclock-gui-${GITHUB_REF_NAME}-windows-x86_64.zip" ecoclock-gui/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/dist/ecoclock-cli-*
            client/dist/ecoclock-gui-*
